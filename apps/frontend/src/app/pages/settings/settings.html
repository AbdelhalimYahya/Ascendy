<div class="mx-auto max-w-2xl py-10">
  <div class="glass p-8">
    <h1 class="font-display text-2xl font-bold">Settings</h1>
    <p class="text-sm text-mist">Profile, language, and competitive mode.</p>
    <form [formGroup]="form" (ngSubmit)="save()" class="mt-6 space-y-5">
      <div>
        <label class="text-sm text-mist">Bio</label>
        <textarea formControlName="bio" rows="3" placeholder="DP enjoyer, aiming for consistency…"
          class="mt-1 w-full rounded-xl border border-line bg-void/60 px-4 py-3 outline-none focus:border-mint"></textarea>
      </div>
      <div class="flex items-center justify-between rounded-xl border border-line bg-white/5 p-4">
        <div>
          <div class="font-semibold">Competitive Mode</div>
          <div class="text-sm text-mist">Off = hide global rank & ratings from your view. Pure learning.</div>
        </div>
        <input type="checkbox" formControlName="competitiveMode" class="h-6 w-6 accent-emerald-400" />
      </div>
      <div>
        <label class="text-sm text-mist">Language</label>
        <select formControlName="languagePref" class="mt-1 w-full rounded-xl border border-line bg-void/60 px-4 py-3">
          <option value="en">English</option>
          <option value="ar">العربية (RTL)</option>
        </select>
      </div>
      <button class="btn-primary w-full">Save changes</button>
      @if (saved()) {
        <p class="text-center text-sm text-mint">Saved ✓</p>
      }
    </form>
  </div>
</div>
